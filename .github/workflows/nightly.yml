name: nightly
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  property:
    runs-on: ubuntu-26.04
    name: property_tests
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: setup_nix
        uses: ./.github/actions/setup-nix
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cachix-token: ${{ secrets.GH_CACHIX }}

      # Only packages with rapid properties accept -rapid.checks. A failure
      # prints the -rapid.seed that reproduces it.
      - name: run
        run: nix develop -c go test -race -timeout 30m -run Property ./iter ./panics ./pool ./stream -rapid.checks=10000
